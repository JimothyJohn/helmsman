# Interop targets. `make opener-up` then `make test-interop`.
# UDP 2222 is not published: the originator binds 2222 itself to receive
# T->O, so the Class 1 tests address the container IP directly (Linux only).
services:
  opener:
    build: ./docker/opener
    image: tcpethernet/opener:0e1ab7e
    ports:
      - "44818:44818/tcp"
      - "44818:44818/udp"
