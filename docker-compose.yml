# Interop targets. `make opener-up` then `make test-interop`.
# UDP 2222 is not published: the originator binds 2222 itself to receive
# T->O, so the Class 1 tests address the container IP directly (Linux only).
services:
  opener:
    build: ./docker/opener
    image: helmsman/opener:0e1ab7e
    ports:
      - "44818:44818/tcp"
      - "44818:44818/udp"
  # Our own adapter (crates/helmsman-adapter) mimicking OpENer's sample, so
  # the same interop suite runs against it. Nothing is published (it would
  # clash with opener); address the container IP.
  adapter:
    build:
      context: .
      dockerfile: docker/adapter/Dockerfile
    image: helmsman/adapter:dev
