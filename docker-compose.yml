# Interop targets. `make opener-up` then `make test-interop`.
# UDP 2222 is not published: the originator binds 2222 itself to receive
# T->O, so the Class 1 tests address the container IP directly (Linux only).
services:
  opener:
    build: ./docker/opener
    image: tcpethernet/opener:0e1ab7e
    ports:
      - "44818:44818/tcp"
      - "44818:44818/udp"
  # Our own adapter (crates/tcpethernet-plc) with OpENer's identity, so the
  # same interop suite runs against it. Nothing CIP is published (it would
  # clash with opener); address the container IP. Web page on 127.0.0.1:8088.
  plc:
    build:
      context: .
      dockerfile: docker/plc/Dockerfile
    image: tcpethernet/plc:dev
    ports:
      - "127.0.0.1:8088:8080"
