[package]
name = "helmsman-node"
version = "0.1.0"
description = "Helmsman's IEC runtime on an ESP32-POE2: the edge spike's firmware (docs/EDGE.md)"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/JimothyJohn/helmsman"
publish = false

# Not a workspace member: the Xtensa target needs the esp toolchain
# (`rustup toolchain list` shows `esp`, from `espup install`) and
# build-std, which the host gate must not pull in. Own Cargo.lock, own
# .cargo/config.toml; build from this folder: `make node-build` at the root.
[workspace]

[dependencies]
# The runtime, without std: the clock comes in through `scan_at`, the
# float functions from libm (helmsman-iec's `libm` feature).
helmsman-iec = { path = "../helmsman-iec", default-features = false, features = ["libm"] }

# The esp-rs stack, at the versions supervictor's edge crate pins (its
# Cargo.lock, 2026-11-02): esp-hal 1.0.0 exactly (1.1 removed unstable
# APIs its neighbours still use), the esp-idf bootloader's app descriptor
# (espflash's bootloader refuses an image without one), esp-alloc with its
# heap statistics (max usage: the G3 number; the per-alloc bookkeeping
# costs a little scan time, named in the output), esp-println on UART0
# (USB serial), esp-backtrace as the panic handler.
esp-hal = { version = "=1.0.0", features = ["esp32", "unstable", "psram", "rt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-alloc = { version = "0.9.0", features = ["internal-heap-stats"] }
esp-println = { version = "0.16.1", features = ["esp32"] }
esp-backtrace = { version = "0.18.1", features = ["esp32", "panic-handler", "println"] }

[profile.release]
# Speed is what is measured; frame pointers stay for esp-backtrace.
opt-level = 3
debug = 2
codegen-units = 1
lto = "fat"
incremental = false
overflow-checks = false
debug-assertions = false

[profile.dev]
# The interpreter in a debug build is too slow to say anything; always
# build release for the board.
opt-level = 1
