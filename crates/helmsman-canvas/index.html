<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Helmsman canvas</title>
    <!-- Before the loader, so it hears every failure (loading/). -->
    <link data-trunk rel="inline" href="loading/loading.js">
    <!-- trunk builds the crate to wasm and injects the loader here -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-initializer="loading/helmsman-canvas-initializer.js">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <link data-trunk rel="inline" href="loading/loading.html">
    <noscript><p style="color:#fff;font-family:sans-serif;padding:16px">Helmsman runs in your browser and needs JavaScript and WebAssembly.</p></noscript>
    <canvas id="canvas"></canvas>
</body>
</html>
