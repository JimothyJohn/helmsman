[package]
name = "helmsman-canvas"
version = "0.1.0"
description = "Node canvas for building PLC logic out of nested function blocks (egui; native and web)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helmsman-graph = { path = "../helmsman-graph" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Window", "HtmlCanvasElement"] }

[lints]
workspace = true
