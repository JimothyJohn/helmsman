[package]
name = "helmsman-canvas"
version = "0.1.0"
description = "The Helmsman browser app: a program's Structured Text and its live diagram, on a box or simulated in the page (egui; native and web)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helmsman-diagram = { path = "../helmsman-diagram" }
helmsman-iec = { path = "../helmsman-iec" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
# The box API's JSON (already in the workspace through helmsman-plc).
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# fetch (Request, RequestInit, Headers, Response; RequestCache,
# RequestCredentials and ReferrerPolicy for the calls made with the
# session cookie) and EventSource (Event, EventTarget, MessageEvent) for
# the box API; Location for `?playground` and the proxy check.
# The simulation's Claude: ReadableStream(DefaultReader) and
# TextDecoder(Options) to read an answer as it streams,
# AbortController/AbortSignal to stop one, Storage for a key the user
# asked to remember, Element for the page's mode.
# Projects: HtmlInputElement, File and FileList for Upload's file picker;
# Blob, BlobPropertyBag, Url and HtmlAnchorElement for Download.
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReferrerPolicy",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "TextDecodeOptions",
    "TextDecoder",
    "Url",
    "Window",
] }

# The real box API, for fixtures in tests. Native only: the wasm graph
# must stay free of SQLite and TLS (tests/wasm_deps.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
helmsman-plc = { path = "../helmsman-plc", features = ["box"] }
helmsman-io = { path = "../helmsman-io" }

[lints]
workspace = true
