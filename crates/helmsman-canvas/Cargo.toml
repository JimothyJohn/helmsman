[package]
name = "helmsman-canvas"
version = "0.1.0"
description = "Live, read-only diagram of a module's Structured Text, plus a lab node editor (egui; native and web)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helmsman-diagram = { path = "../helmsman-diagram" }
helmsman-graph = { path = "../helmsman-graph" }
helmsman-iec = { path = "../helmsman-iec" }
# The runtime only: no SQLite store, HTTP API or TLS, so it builds for wasm32.
helmsman-plc = { path = "../helmsman-plc", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
# The box API's JSON (already in the workspace through helmsman-plc).
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# fetch (Request, RequestInit, Headers, Response; RequestCache and
# RequestCredentials for the review screen) and EventSource (Event,
# EventTarget, MessageEvent) for the box API; Location for `?demo`.
# ReadableStream(DefaultReader) and TextDecoder(Options): POST
# /api/explain with the token in a header, read as it streams.
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Event",
    "EventSource",
    "EventTarget",
    "Headers",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "TextDecodeOptions",
    "TextDecoder",
    "Window",
] }

# The real box API, for fixtures in tests. Native only: the wasm graph
# must stay free of SQLite and TLS (tests/wasm_deps.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
helmsman-plc = { path = "../helmsman-plc", features = ["box"] }
helmsman-io = { path = "../helmsman-io" }

[lints]
workspace = true
