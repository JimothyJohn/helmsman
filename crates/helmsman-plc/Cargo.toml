[package]
name = "helmsman-plc"
version = "0.1.0"
description = "Soft PLC: an IEC 61131-3 Structured Text program behind the CIP adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helmsman-adapter = { path = "../helmsman-adapter" }
# The chat panel's agent loop (relay client and tools), for the box API's
# /api/chat; https follows ours.
helmsman-agent = { path = "../helmsman-agent", default-features = false, optional = true }
# Explain mode: the box explains its own traces (/api/explain).
helmsman-diagram = { path = "../helmsman-diagram", optional = true }
helmsman-iec = { path = "../helmsman-iec" }
helmsman-io = { path = "../helmsman-io" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
sha2 = { version = "0.11.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
# Ed25519 for bundle signatures (bundle::sign says why ring). Already in the
# lockfile through rustls; the `box` feature now needs it too.
ring = { version = "0.17.14", optional = true }

[dev-dependencies]
# The box build itself never enables `unrestricted`; its tests play scanner.
helmsman-proto = { path = "../helmsman-proto", features = ["unrestricted"] }
proptest = "1.12"

[lints]
workspace = true

[features]
# `box`: what only a real box needs: the snapshot store (SQLite, built from
# C), the HTTP API, serial ports (modbus-rtu) and the board's GPIO / I2C
# (Linux), and the binary. Without it the crate is the runtime
# alone (scheduler, signals, links, tap, replay), which the canvas embeds
# and which builds for wasm32.
# `https`: https:// sinks (rustls with the ring provider, Mozilla roots
# compiled in). On by default so the Pi can post to a cloud receiver;
# `--no-default-features --features box` builds an http-only box.
default = ["box", "https"]
box = ["dep:rusqlite", "dep:ring", "dep:helmsman-agent", "dep:helmsman-diagram", "helmsman-io/serial", "helmsman-io/gpio"]
https = ["dep:rustls", "dep:webpki-roots", "helmsman-agent?/https"]

[[bin]]
name = "helmsman-plc"
path = "src/main.rs"
required-features = ["box"]

[[test]]
name = "api"
required-features = ["box"]

[[test]]
name = "bin"
required-features = ["box"]

[[test]]
name = "sink_bin"
required-features = ["box"]

[[test]]
name = "bundle"
required-features = ["box"]

[[test]]
name = "store"
required-features = ["box"]

[[test]]
name = "approval"
required-features = ["box"]

[[test]]
name = "policy"
required-features = ["box"]

[[test]]
name = "ui"
required-features = ["box"]

[[test]]
name = "reload"
required-features = ["box"]

[[test]]
name = "agent"
required-features = ["box"]

[[test]]
name = "dropins"
required-features = ["box"]
