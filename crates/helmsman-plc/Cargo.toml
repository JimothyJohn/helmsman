[package]
name = "helmsman-plc"
version = "0.1.0"
description = "Soft PLC: an IEC 61131-3 Structured Text program behind the CIP adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helmsman-adapter = { path = "../helmsman-adapter" }
helmsman-iec = { path = "../helmsman-iec" }
helmsman-io = { path = "../helmsman-io" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "0.11.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }

[dev-dependencies]
# The box build itself never enables `unrestricted`; its tests play scanner.
helmsman-proto = { path = "../helmsman-proto", features = ["unrestricted"] }
proptest = "1.12"

[lints]
workspace = true

[features]
# https:// sinks (rustls with the ring provider, Mozilla roots compiled in).
# On by default so the Pi build can post to a cloud receiver; build with
# --no-default-features for an http-only box with no third-party crates.
default = ["https"]
https = ["dep:rustls", "dep:webpki-roots"]
