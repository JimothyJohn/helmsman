# The Linux download: on a v* tag, the box as a static binary for aarch64
# and x86_64, each packed with the browser editor it serves and its systemd
# unit (scripts/package-release.sh), attached to a GitHub release with its
# sha256. scripts/install.sh installs exactly these.
#
# A pull request that touches the pieces builds, packs and installs into a
# test root the same way, and publishes nothing: so a release is never the
# first time the build is tried.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package-release.sh'
      - 'deploy/helmsman-plc.service'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The editor is the same wasm on every machine: built once.
  canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # A tag's version is the box's: v0.1.0 is helmsman-plc 0.1.0, or
      # the download would say one thing and the program another.
      - name: The tag is the box's version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="helmsman-plc"))')"
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME, but helmsman-plc is $version"; exit 1; }
      - name: Install trunk
        run: command -v trunk || cargo install trunk --locked
      - name: Build the editor
        run: ./scripts/canvas-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-canvas
          path: target/canvas-dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: canvas
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    env:
      # cc-rs takes the C compiler for the bundled SQLite and ring from
      # these; musl-tools has musl-gcc for the runner's own architecture.
      CC_aarch64_unknown_linux_musl: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: The musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-canvas
          path: target/canvas-dist
      - name: Build the box (static)
        run: cargo build -p helmsman-plc --release --locked --target ${{ matrix.target }}
      - name: It needs nothing from the machine it runs on
        run: |
          bin=target/${{ matrix.target }}/release/helmsman-plc
          strip "$bin"
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked' \
            || { echo "::error::helmsman-plc is not statically linked"; exit 1; }
      - name: Pack
        run: ./scripts/package-release.sh ${{ matrix.target }} target/${{ matrix.target }}/release/helmsman-plc target/canvas-dist dist
      # The installer on what was just packed, into a test root, and the
      # installed program run: an archive the installer refuses, or a
      # binary that does not start, stops here and not on a user's machine.
      - name: Install it into a test root and run it
        run: |
          root="$(mktemp -d)"
          HELMSMAN_INSTALL_ROOT="$root" ./scripts/install.sh --local dist/helmsman-${{ matrix.target }}.tar.gz
          test -f "$root/usr/local/share/helmsman-plc/ui/index.html"
          test -f "$root/etc/systemd/system/helmsman-plc.service"
          "$root/usr/local/bin/helmsman-plc" --help >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmsman-${{ matrix.target }}
          path: dist/helmsman-*.tar.gz*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helmsman-*
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            helmsman-*.tar.gz
            helmsman-*.sha256
          generate_release_notes: true
