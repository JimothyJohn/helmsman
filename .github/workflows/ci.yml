# Baseline CI for Rust (cargo workspace) repos — copy to .github/workflows/ci.yml.
# The `gate` job name is the required status check that branch protection on
# `dev` and the automerge workflow rely on: if you rename the job or add jobs
# (e.g. an embedded/cross build), update the protection rule's contexts to
# match (see README.md).
# SHA-pinned actions only (house rule). For exotic targets, add a second job
# that generates throwaway fixtures (certs, keys) on the runner — see
# supervictor's ci.yml `embedded` job for a worked example.
name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites this change needs (scripts/ci-changes.sh, tested by
  # scripts/test-ci-changes.sh first). A pull request is compared with its
  # merge commit's first parent, the base it would land on; a push to dev
  # or master runs everything. Every condition below reads "!= 'false'", so
  # a missing answer runs the suite, and `gate` fails if this job did not
  # succeed: a broken classifier blocks the merge instead of skipping CI.
  # Skipping is done with job and step `if:`s, never a workflow `paths:`
  # filter: a skipped job reports success to branch protection, a workflow
  # that never ran leaves the required checks waiting.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.which.outputs.rust }}
      help: ${{ steps.which.outputs.help }}
      interop: ${{ steps.which.outputs.interop }}
      oracle: ${{ steps.which.outputs.oracle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Test the classifier
        run: ./scripts/test-ci-changes.sh
      - name: Classify the change
        id: which
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet HEAD^1 >/dev/null; then
            git diff --name-only --no-renames -z HEAD^1 HEAD | ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'rust=true\nhelp=true\ninterop=true\noracle=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  gate:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: The change was classified
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "the changes job did not succeed (${{ needs.changes.result }}): fix it before this can merge"
          exit 1
      - name: Nothing to build
        if: ${{ needs.changes.outputs.help == 'false' }}
        run: echo "Only files no build or test reads changed (scripts/ci-changes.sh); the gate passes without building."
      # The help check below needs the checkout, the toolchain and the cache
      # too, and `help` is true whenever `rust` is (scripts/ci-changes.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.help != 'false' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        if: ${{ needs.changes.outputs.help != 'false' }}
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      # Dependencies' builds, kept between runs. Only dev and master save
      # (a pull request reads its base's cache), so PRs cannot evict them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ needs.changes.outputs.help != 'false' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
      - name: Format check
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The two builds that broke dev on 2026-10-30 without CI noticing:
      # helmsman-plc without its `box` feature (the runtime the canvas
      # embeds) and the canvas itself for wasm32. Same as scripts/lint.sh.
      - name: Runtime without the box feature
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo check -p helmsman-plc --no-default-features --all-targets
      - name: Canvas for wasm32
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo check --target wasm32-unknown-unknown -p helmsman-canvas
      # helmsman-iec without std, as the edge node builds it (docs/EDGE.md
      # Phase 0, G1): a cheap upstream target proves no_std without the
      # Xtensa toolchain. Same as scripts/lint.sh.
      - name: helmsman-iec without std
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo clippy -p helmsman-iec --no-default-features --features libm --target thumbv7em-none-eabihf -- -D warnings
      # The Modbus codec the node and helmsman-io share is no_std too.
      - name: helmsman-modbus without std
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo clippy -p helmsman-modbus --target thumbv7em-none-eabihf -- -D warnings
      - name: Test workspace
        if: ${{ needs.changes.outputs.rust != 'false' }}
        run: cargo test --workspace --locked
      # The committed help pages (docs/help/*.html, GitHub Pages serves
      # them) against docs/help/*.md and the tables generated from the
      # code: simulation.html drifted after #288 with nothing to notice.
      # pandoc is pinned to the release the pages were built with and
      # checked by hash, because its HTML differs between releases; when
      # the pages are rebuilt with a newer pandoc, change both lines.
      - name: Install pandoc
        if: ${{ needs.changes.outputs.help != 'false' }}
        env:
          PANDOC_VERSION: '3.11'
          PANDOC_SHA256: 89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version
      - name: Help pages are current
        if: ${{ needs.changes.outputs.help != 'false' }}
        run: ./scripts/build-help.sh --check

  # Interop against the OpENer adapter built from docker/opener/. Separate
  # job so a Docker hiccup is distinguishable from a code failure. Added to
  # the required checks on dev alongside `gate` (see repo-baseline README).
  # Runs when the EtherNet/IP code, its containers or what CI builds with
  # changed (scripts/ci-changes.sh); skipped, it reports success.
  interop:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.interop != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
      - name: Start OpENer
        run: docker compose up -d --build opener
      - name: Wait for OpENer to listen
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/44818) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs opener
          exit 1
      - name: Interop suite
        # Address the container directly so both TCP and UDP come from the
        # bridge gateway, which is where OpENer sends T->O (port 2222).
        run: |
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q opener)")
          echo "OpENer at $ip"
          HELMSMAN_OPENER_ADDR="$ip" ./scripts/test-interop.sh
        env:
          HELMSMAN_OPENER_IO: '1'
      - name: OpENer logs
        if: always()
        run: docker compose logs opener
      - name: Stop OpENer
        if: always()
        run: docker compose down

  # The same interop suite against our own adapter (helmsman-adapter, which
  # mimics OpENer's sample). Not a required check until it has a green history.
  # Same trigger as `interop`.
  interop-adapter:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.interop != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
      - name: Start helmsman-adapter
        run: docker compose up -d --build adapter
      - name: Wait for it to listen
        run: |
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q adapter)")
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/$ip/44818) 2>/dev/null; then echo "adapter at $ip"; echo "ADAPTER_IP=$ip" >> "$GITHUB_ENV"; exit 0; fi
            sleep 1
          done
          docker compose logs adapter
          exit 1
      - name: Interop suite against helmsman-adapter
        run: HELMSMAN_OPENER_ADDR="$ADAPTER_IP" ./scripts/test-interop.sh
        env:
          HELMSMAN_OPENER_IO: '1'
      - name: Adapter logs
        if: always()
        run: docker compose logs adapter
      - name: Stop
        if: always()
        run: docker compose down

  # The Structured Text interpreter against ruSTy, an independent compiler
  # (docker/rusty/, pinned and hash-checked). ruSTy is only executed as an
  # oracle, never linked. Not a required check. Runs when helmsman-iec, the
  # ruSTy image or what CI builds with changed (scripts/ci-changes.sh).
  oracle:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.oracle != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
      - name: Differential test against ruSTy
        run: ./scripts/test-oracle.sh
