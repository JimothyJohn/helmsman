# Keeps auto-merge PRs into `dev` up to date, so dev's protection can require
# branches to be current (strict) without a merge queue (GitHub offers none
# on a personal-account repo). When dev moves, every open, non-draft,
# same-repo PR into dev with auto-merge on that is behind gets
# `update-branch` (behind = dev has commits the head lacks); its CI re-runs on the new tip and auto-merge lands the
# PRs one at a time, each tested against what it will merge into.
# (TODO.md dev-merge-safety-2.)
#
# Token: an update pushed with GITHUB_TOKEN starts no workflows, so the
# updated PR would wait forever for its checks. UPDATE_BRANCH_TOKEN is a
# fine-grained PAT on this repo only, with Contents and Pull requests
# read/write. Until it is set the job only leaves a notice and succeeds, so
# the 15-minute schedule doesn't fail (and mail) every run.
# Triggers: a push to dev; and every 15 minutes, because a merge that
# automerge.yml enabled (GITHUB_TOKEN) fires no push event either.
# Nothing here checks out or runs PR code: only `gh` calls.
name: Update branches

on:
  push:
    branches: [dev]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update auto-merge PRs that are behind dev
        env:
          GH_TOKEN: ${{ secrets.UPDATE_BRANCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::UPDATE_BRANCH_TOKEN is not set yet; nothing updated (see the header of this workflow)"
            exit 0
          fi
          # Behind is read from the comparison, not mergeStateStatus: while a
          # PR's checks run GitHub reports it BLOCKED, and by the time it
          # turns BEHIND no push to dev is left to wake this job.
          candidates="$(gh pr list -R "$REPO" --base dev --state open --limit 100 \
            --json number,isDraft,autoMergeRequest,isCrossRepository,headRefName \
            --jq '.[] | select(.isDraft | not) | select(.isCrossRepository | not)
                      | select(.autoMergeRequest != null) | "\(.number) \(.headRefName)"')"
          prs=""
          while read -r n head; do
            [ -n "$n" ] || continue
            behind="$(gh api "repos/$REPO/compare/$head...dev" --jq .ahead_by)"
            if [ "$behind" -gt 0 ]; then prs="$prs $n"; fi
          done <<<"$candidates"
          if [ -z "$prs" ]; then
            echo "nothing behind"
            exit 0
          fi
          for n in $prs; do
            echo "updating #$n"
            # A PR that conflicts or was just updated fails here; the next run retries.
            gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null || echo "::warning::#$n not updated"
          done
