[workspace]
resolver = "3"
members = ["crates/helmsman-proto", "crates/helmsman-agent", "crates/helmsman-adapter", "crates/helmsman-canvas", "crates/helmsman-diagram", "crates/helmsman-iec", "crates/helmsman-io", "crates/helmsman-plc", "crates/helmsman-project"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/JimothyJohn/helmsman"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
