[workspace]
resolver = "3"
members = ["crates/helmsman-proto", "crates/helmsman-adapter", "crates/helmsman-canvas", "crates/helmsman-cli", "crates/helmsman-graph", "crates/helmsman-iec", "crates/helmsman-io", "crates/helmsman-plc"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JimothyJohn/helmsman"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
