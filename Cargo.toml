[workspace]
resolver = "3"
members = ["crates/tcpethernet", "crates/tcpethernet-adapter", "crates/tcpethernet-canvas", "crates/tcpethernet-cli", "crates/tcpethernet-graph", "crates/tcpethernet-iec", "crates/tcpethernet-plc"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JimothyJohn/tcpethernet"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
