[workspace]
resolver = "3"
members = ["crates/helmsman-proto", "crates/helmsman-agent", "crates/helmsman-adapter", "crates/helmsman-canvas", "crates/helmsman-devconf", "crates/helmsman-diagram", "crates/helmsman-iec", "crates/helmsman-io", "crates/helmsman-l2", "crates/helmsman-modbus", "crates/helmsman-nodecore", "crates/helmsman-plc", "crates/helmsman-profinet", "crates/helmsman-project"]
# The edge node's firmware (docs/EDGE.md): the Xtensa target needs the esp
# toolchain and build-std, so it is its own package with its own lock,
# built by `make node-build`; the host gate never sees it.
exclude = ["crates/helmsman-node", "crates/helmsman-node-p4"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/JimothyJohn/helmsman"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
